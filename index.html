<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyApp</title>
<meta name="description" content="StudyApp — privacy policy and support.">
<style>
  :root {
    --bg: #ffffff; --ink: #16181d; --ink-secondary: #4a4f5a;
    --rule: #e2e2df; --accent: #2c5f4f; --surface: #f6f6f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --ink: #eef0f3; --ink-secondary: #b4bac4;
      --rule: #2c3039; --accent: #7fc4ac; --surface: #1d2026;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 0 20px 96px; background: var(--bg); color: var(--ink);
    font: 17px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 64px 0 8px; }
  p.tagline { color: var(--ink-secondary); margin: 0 0 40px; }
  a.card {
    display: block; background: var(--surface); border-radius: 12px;
    padding: 20px; margin-bottom: 14px; text-decoration: none; color: inherit;
  }
  a.card strong { display: block; color: var(--accent); font-size: 1.1rem; margin-bottom: 4px; }
  a.card span { color: var(--ink-secondary); font-size: 0.95rem; }
  footer {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule);
    font-size: 0.92rem; color: var(--ink-secondary);
  }
  footer a { color: var(--accent); }
  @media (max-width: 480px) { body { font-size: 16px; padding: 0 16px 72px; } h1 { font-size: 1.65rem; } }
</style>
</head>
<body>
<main>
  <h1>StudyApp</h1>
  <p class="tagline">An iPhone app for tracking study sessions and sharing them with friends.</p>

  <a class="card" href="privacy-policy.html">
    <strong>Privacy policy</strong>
    <span>What we collect, where it is stored, and how to delete it.</span>
  </a>

  <a class="card" href="support.html">
    <strong>Support</strong>
    <span>Reporting, blocking, deleting your account, and known issues.</span>
  </a>

  <footer>
    Questions? <a href="mailto:andersrodeik@gmail.com">andersrodeik@gmail.com</a><br>
    Anders Roed, sole trader, Norway
  </footer>
</main>
</body>
</html>
